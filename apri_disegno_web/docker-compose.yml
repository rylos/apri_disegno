version: '3.8'

services:
  apri_disegno_web:
    build: .
    container_name: apri_disegno_web
    ports:
      - "5000:5000"
    volumes:
      - db_disegni:/mnt/srv01/DB_DISEGNI:ro
      - elaborati_tecnici:/mnt/srv03/elaborati_tecnici:ro
      - elaborati_tecnici_old:/mnt/srv03/elaborati_tecnici_old:ro
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome

volumes:
  db_disegni:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SAMBA_USER},password=${SAMBA_PASS},uid=1000,gid=1000,iocharset=utf8"
      device: "//srv01.liftingitalia.local/DB_DISEGNI"
  
  elaborati_tecnici:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SAMBA_USER},password=${SAMBA_PASS},uid=1000,gid=1000,iocharset=utf8"
      device: "//srv03.liftingitalia.local/elaborati_tecnici"

  # Archivio storico: usato solo dalle ricerche con "archivio storico" acceso
  elaborati_tecnici_old:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SAMBA_USER},password=${SAMBA_PASS},uid=1000,gid=1000,iocharset=utf8"
      device: "//srv03.liftingitalia.local/Elaborati_Tecnici_OLD"

